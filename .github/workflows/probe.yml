name: probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://repo1.maven.org/maven2/io/getstream/stream-webrtc-android
          vs=$(curl -s $B/maven-metadata.xml | grep -o "<version>[^<]*</version>" | sed 's/<[^>]*>//g' | tail -8)
          echo "::warning::versions: $(echo $vs | tr '\n' ' ')"
          for v in $vs 1.1.3; do
            curl -sL -o x.aar $B/$v/stream-webrtc-android-$v.aar || continue
            unzip -o -q x.aar classes.jar -d a 2>/dev/null || continue
            n=$(unzip -l a/classes.jar | grep -c "org/webrtc/AudioTrackSink" || true)
            m=$(unzip -l a/classes.jar | grep -c "PlaybackSamples\|AudioTrackSink\|PlayoutSamples" || true)
            echo "::warning::$v AudioTrackSink=$n PlaybackSamples=$m"
            rm -rf a x.aar
          done
