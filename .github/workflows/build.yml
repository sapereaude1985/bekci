name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > bekci.jks; fi

      - name: Derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set +e
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log
          st=${PIPESTATUS[0]}
          if [ $st -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Unresolved|Could not|FAILED|AssertionError|Exception" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $st

      - name: Test sonuçları
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testReleaseUnitTest/*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  st = 'GEÇTİ'
                  if tc.find('failure') is not None or tc.find('error') is not None: st = 'KALDI'
                  elif tc.find('skipped') is not None: st = 'ATLANDI'
                  print(f"::notice::TEST {tc.get('name')}: {st} ({tc.get('time')} sn)")
          PY

      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk bekci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bekci-apk
          path: bekci.apk

      - name: Sürüm olarak yayınla (telefondan kolay indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bekçi ${{ github.run_number }}
          files: bekci.apk
